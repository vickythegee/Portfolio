<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <style>
        input{
            border: 2px solid blue;
        }

       

    </style>

</head>
<body style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: aquamarine;">
    <h1 style="text-align: center;">Registration Form</h1><br>

    <form action="" style="border: 3px solid aliceblue;">
        <div style="padding: 25px; background-color: lightcoral;" id="container">
            <label for="">First Name:</label>
            <input type="text" name="firstname" id=""><br><br>

            <label for="">Middle Name:</label>
            <input type="text" name="middlename" id=""><br><br>

            <label for="">Last Name:</label>
            <input type="text" name="lastname" id=""><br> <br>

            
            <label for="">Email:</label>
            <input type="email" name="email" id=""><br><br>

           <label for="">Course:</label>

           <select name="" id="">
            <option value="IT">IT</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Engineering">Engineering</option>
           </select><br> <br>

           <label for="">Gender:</label><br>
           <input type="radio" name="male" id="">Male <br>
           <input type="radio" name="female" id="">Female<br><br>

           <label for="">Password:</label><input type="password" name="" id="password"><br><br>

           <label for="">Re-enter password:</label>
           <input type="password" name="" id="password"><br><br>

           <button type="submit">Submit</button>



        </div>

    </form>
    
</body>
</html>
