<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

            background-color: aquamarine;
        }

        button{
            background-color: rgb(36, 120, 120);
            width: 100%;
            color:white;
            margin: 10px;
            border: none;
            cursor: pointer;
            padding: 15px;
        }

        input[type=text], input[type=password]{
            width: 100%;
            margin: 8px;
        }

        button:hover{
            opacity: 0.5;
        }

        #cancelbtn{
            width: auto;
        }

        
    </style>
</head>
<body>
    <h1 style="text-align: center;">Login form</h1>

    <form action="" style= "border: 3px solid beige">
    <div style="padding: 30px; background-color: lightcoral;">
        <label for="">Username:</label>
        <input type="text" name="" id="" required><br>


        <label for="">Password:</label>
        <input type="password" required><br>


        <button type="submit" id="loginbtn">Login</button><br>

        <input type="checkbox" name="" id="" checked="checked">Remember me</inpuut>

        <button type="button" id="cancelbtn">Cancel</button><br>

        <a href="#">Forgot Password?</a><br>

        <a href="signin.html">Register</a>
    </div>

    </form>
</body>
</html>
