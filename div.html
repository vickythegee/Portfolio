<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division</title>
</head>
<body>

    <div style="color: blue; border: 2px solid; background-color: beige;">
        <h4>This is a container</h4>
        <ul>
            <li>Rigatoni</li>
            <li>Penne</li>
            <li>linguine</li>
            <li>Macaroni</li>
        </ul>
    </div>

    <div style="color: red; border: 2px solid; background-color: greenyellow; margin-top: 20px;">
        <h4>This is a container</h4>

        <p>pasta list</p>
        <ul>
            <li>Rigatoni</li>
            <li>Penne</li>
            <li>linguine</li>
            <li>Macaroni</li>
        </ul>
    </div>
    
</body>
</html>
